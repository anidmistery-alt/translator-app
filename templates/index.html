<!DOCTYPE html>
<html>
<head>
    <title>Bengali → English Translator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #4e73df, #1cc88a);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: white;
            width: 95%;
            max-width: 420px;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border-radius: 8px;
            border: 1px solid #ccc;
            font-size: 15px;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .btn-text {
            background: #4e73df;
            color: white;
        }

        .btn-voice {
            background: #1cc88a;
            color: white;
        }

        .loader {
            display: none;
            margin-top: 15px;
        }

        .spinner {
            border: 4px solid #eee;
            border-top: 4px solid #4e73df;
            border-radius: 50%;
            width: 28px;
            height: 28px;
            animation: spin 1s linear infinite;
            margin: auto;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .output {
            margin-top: 15px;
            background: #f8f9fc;
            padding: 12px;
            border-radius: 10px;
            text-align: left;
        }

        .label {
            font-weight: bold;
            margin-top: 10px;
        }

        audio {
            width: 100%;
            margin-top: 5px;
        }

        #error {
            color: red;
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
</head>

<body>

<div class="card">
    <h2>🌐 Bengali → English Translator</h2>

    <input type="text" id="textInput" placeholder="Type Bengali text">

    <button class="btn-text" onclick="translateText()">
        Translate Text
    </button>

    <button class="btn-voice" onclick="startRecording()">
        🎤 Speak Bengali
    </button>

    <div class="loader" id="loader">
        <div class="spinner"></div>
        <p>Processing...</p>
    </div>

    <div id="error"></div>

    <div class="output">
        <div class="label">Bengali:</div>
        <p id="bn"></p>
        <audio id="bn_audio" controls></audio>

        <div class="label">English:</div>
        <p id="en"></p>
        <audio id="en_audio" controls></audio>
    </div>
</div>

<script>

function showLoader(show){
    document.getElementById("loader").style.display = show ? "block" : "none";
    document.getElementById("error").innerText = "";
}

/* ---------- TEXT TRANSLATION ---------- */
function translateText() {
    const text = document.getElementById("textInput").value;

    if(text.trim() === ""){
        document.getElementById("error").innerText = "Please type Bengali text.";
        return;
    }

    showLoader(true);

    let formData = new FormData();
    formData.append("text", text);

    fetch("/translate_text", {
        method: "POST",
        body: formData
    })
    .then(res => res.json())
    .then(data => {
        showLoader(false);

        if(data.error){
            document.getElementById("error").innerText = data.error;
            return;
        }

        document.getElementById("bn").innerText = data.bengali;
        document.getElementById("en").innerText = data.english;
        document.getElementById("bn_audio").src = data.bn_audio;
        document.getElementById("en_audio").src = data.en_audio;
    });
}


/* ---------- VOICE TRANSLATION ---------- */
let mediaRecorder;
let chunks = [];

function startRecording(){

    showLoader(true);
    chunks = [];

    navigator.mediaDevices.getUserMedia({ audio:true })
    .then(stream => {

        mediaRecorder = new MediaRecorder(stream);
        mediaRecorder.start();

        mediaRecorder.ondataavailable = e => {
            chunks.push(e.data);
        };

        setTimeout(() => {
            mediaRecorder.stop();
        }, 4000);

        mediaRecorder.onstop = () => {

            let blob = new Blob(chunks, { type: "audio/webm" });

            let formData = new FormData();
            formData.append("audio", blob, "voice.webm");

            fetch("/translate_voice", {
                method: "POST",
                body: formData
            })
            .then(res => res.json())
            .then(data => {
                showLoader(false);

                if(data.error){
                    document.getElementById("error").innerText = data.error;
                    return;
                }

                document.getElementById("bn").innerText = data.bengali;
                document.getElementById("en").innerText = data.english;
                document.getElementById("bn_audio").src = data.bn_audio;
                document.getElementById("en_audio").src = data.en_audio;
            });
        };

    })
    .catch(err => {
        showLoader(false);
        document.getElementById("error").innerText =
            "Microphone permission denied or unavailable.";
    });
}

</script>

</body>
</html>
