<!DOCTYPE html>
<html>
<head>
    <title>Bengali → English Translator</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        body{
            margin:0;
            font-family:Arial;
            background:linear-gradient(135deg,#4e73df,#1cc88a);
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
        }

        .card{
            background:white;
            width:95%;
            max-width:420px;
            padding:20px;
            border-radius:15px;
            text-align:center;
        }

        input,button{
            width:100%;
            padding:12px;
            margin-top:10px;
            border-radius:8px;
            border:none;
        }

        button{
            background:#4e73df;
            color:white;
            font-weight:bold;
        }

        .voice-btn{
            background:#1cc88a;
        }

        .loader{
            display:none;
            margin-top:10px;
        }

        audio{
            width:100%;
            margin-top:5px;
        }

        #error{
            color:red;
            font-size:14px;
            margin-top:8px;
        }
    </style>
</head>

<body>

<div class="card">

    <h2>🌐 Bengali → English</h2>

    <input id="textInput" placeholder="Type Bengali text">

    <button onclick="translateText()">Translate Text</button>

    <button class="voice-btn" onclick="startVoice()">
        🎤 Speak Bengali
    </button>

    <div class="loader" id="loader">Processing...</div>

    <div id="error"></div>

    <h4>Bengali</h4>
    <p id="bn"></p>
    <audio id="bn_audio" controls></audio>

    <h4>English</h4>
    <p id="en"></p>
    <audio id="en_audio" controls></audio>

</div>

<script>

function showLoader(show){
    document.getElementById("loader").style.display =
        show ? "block" : "none";
    document.getElementById("error").innerText = "";
}

/* ---------- TEXT TRANSLATION ---------- */
function translateText(){

    let text = document.getElementById("textInput").value;

    if(text.trim()===""){
        document.getElementById("error").innerText =
            "Please enter text.";
        return;
    }

    showLoader(true);

    let formData = new FormData();
    formData.append("text", text);

    fetch("/translate_text",{
        method:"POST",
        body:formData
    })
    .then(res=>res.json())
    .then(data=>{
        showLoader(false);

        if(data.error){
            document.getElementById("error").innerText=data.error;
            return;
        }

        document.getElementById("bn").innerText=data.bengali;
        document.getElementById("en").innerText=data.english;
        document.getElementById("bn_audio").src=data.bn_audio;
        document.getElementById("en_audio").src=data.en_audio;
    });
}

/* ---------- MOBILE VOICE RECOGNITION (FIXED) ---------- */
function startVoice(){

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if(!SpeechRecognition){
        alert("Speech recognition not supported in this browser.");
        return;
    }

    const recognition = new SpeechRecognition();

    recognition.lang = "bn-BD";   // Bengali
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;

    showLoader(true);

    recognition.start();

    recognition.onresult = function(event){
        const bengaliText = event.results[0][0].transcript;

        document.getElementById("textInput").value = bengaliText;

        translateText(); // auto translate
    };

    recognition.onerror = function(event){
        showLoader(false);
        document.getElementById("error").innerText =
            "Mic error: " + event.error;
    };
}

</script>

</body>
</html>
